  - id: KPI-017
    name: Error-correction support touchpoints
    definition: Support touchpoints attributable to correcting activation errors
    formula: Count of error-correction touchpoints per period, also normalized per 1,000 activations
    unit: Count, and touchpoints per 1,000 activations
