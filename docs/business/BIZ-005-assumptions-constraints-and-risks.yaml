assumptions:
  - id: ASM-001
    statement: The initial target may be limited to new customers or may also include existing customers restructuring their organizations
    source: Blueprint section 2, customer segments
    validation_status: UNVALIDATED
    validation_method: Product decision by the business sponsor
    confirm_by: STK-010
    related: [DEC-002]
  - id: ASM-002
    statement: Value is realised through the existing payroll offering rather than a new activation-specific revenue stream
    source: Blueprint section 2, revenue streams
    validation_status: UNVALIDATED
    validation_method: Confirmation by the business sponsor
    confirm_by: STK-010
    related: [BEN-008]
  - id: ASM-003
    statement: The reduction in implementation effort and operating cost can be quantified
    source: Blueprint section 2, cost structure
    validation_status: UNVALIDATED
    validation_method: Baseline effort and cost measurement
    confirm_by: STK-004
    related: [OQ-005, OQ-006]
  - id: ASM-004
    statement: Source employee data arrives as external payroll exports whose schemas differ from the internal data fields
    source: Problem statement.md sections 3 and 5
    validation_status: UNVALIDATED
    validation_method: Review of a sample of real client input files
    confirm_by: STK-002
    related: [DEC-009]
  - id: ASM-005
    statement: An authoritative source exists for each client entity hierarchy
    source: product-backlog.md PA-05 dependencies
    validation_status: UNVALIDATED
    validation_method: Identify the source system and owner of entity hierarchy data
    confirm_by: STK-003
    related: [DEC-013, DEP-003]
  - id: ASM-006
    statement: The statutory engines can execute a non-committing simulation using production-equivalent rules
    source: Problem statement.md section 3; product-backlog.md PA-08 dependencies
    validation_status: UNVALIDATED
    validation_method: Technical confirmation with the statutory engine owner
    confirm_by: STK-004
    related: [DEC-016, DEP-004]
  - id: ASM-007
    statement: Validation issues can be classified as blocking, requiring review, or informational
    source: epic-03 scope
    validation_status: UNVALIDATED
    validation_method: Classification defined by the payroll or compliance owner
    confirm_by: STK-003
    related: [DEC-006]
  - id: ASM-008
    statement: Record-level failures can be isolated without weakening any required validation or compliance control
    source: Blueprint section 3, business rules
    validation_status: UNVALIDATED
    validation_method: Control review by the payroll or compliance owner
    confirm_by: STK-003
    related: [DEC-006, RSK-001]
  - id: ASM-009
    statement: Corrected records can be revalidated individually without reprocessing the batch
    source: Blueprint section 3; README.md epics section
    validation_status: UNVALIDATED
    validation_method: Confirmation during workflow design
    confirm_by: STK-004
    related: [PA-13]
  - id: ASM-010
    statement: An authoritative pay-code catalogue exists against which custom pay codes can be mapped
    source: product-backlog.md PA-04 dependencies
    validation_status: UNVALIDATED
    validation_method: Identify the catalogue and its owner
    confirm_by: STK-003
    related: [DEC-012, DEP-002]
  - id: ASM-011
    statement: Cycle time, support touchpoints and first-payroll corrections can be measured from existing records
    source: Inferred from the three program targets
    validation_status: UNVALIDATED
    validation_method: Data source discovery for each KPI
    confirm_by: STK-004
    related: [DEC-005, DEP-007]
  - id: ASM-012
    statement: The industry context is payroll management and human capital management software and services
    source: Task 01 prompt; not stated in any baseline document
    validation_status: UNVALIDATED
    validation_method: Confirmation by the business sponsor
    confirm_by: STK-010
    related: [DEC-001]
  - id: ASM-013
    statement: The initial customer segment is enterprise clients activating hundreds or thousands of employee profiles at once
    source: Problem statement.md section 1; Task 01 prompt
    validation_status: UNVALIDATED
