constraints:
  - id: CON-001
    statement: Activation setup must preserve payroll data integrity and statutory compliance
    source: Blueprint section 1, constraints
    control_tier: Proposed business rule pending confirmation of the applicable legal requirements
  - id: CON-002
    statement: Validation and simulation must occur before profiles are hard-committed to live payroll
    source: Blueprint section 1, constraints
    control_tier: Proposed business rule
  - id: CON-003
    statement: Invalid records must be isolated without losing the status of valid records
    source: Blueprint section 1, constraints
    control_tier: Proposed business rule
  - id: CON-004
    statement: Employee identity, compensation, tax, benefits and banking information requires appropriate protection, with access and retention limited to what activation needs
    source: Blueprint sections 1 and 3, information handled
    control_tier: Employer and provider policy pending confirmation; legal requirements unknown until DEC-001
  - id: CON-005
    statement: No statutory jurisdiction, regulation or obligation may be assumed until recorded from an authoritative source
    source: Task 01 prompt section 2
    control_tier: Project governance rule
  - id: CON-006
    statement: AI assistance is optional and must not block core guided activation
    source: product-backlog.md refinement decision 8; requirements-document-map.md
    control_tier: Proposed business rule
  - id: CON-007
    statement: Historical payroll migration, including prior pay runs and year-to-date balances, is excluded
    source: README.md scope; requirements-document-map.md
    control_tier: Scope decision
  - id: CON-008
    statement: No fixed batch error-rate suspension threshold may be introduced without an approved policy
    source: Blueprint section 5; epic-04 out of scope
    control_tier: Proposed business rule
risks:
  - id: RSK-001
    statement: Partial commit activates a record that should have been blocked, because the blocking policy is undefined
    cause: DEC-006 unresolved
    impact: Incorrect statutory profile in live payroll
    provisional_rating: High
    mitigation: Allow no activation until the blocking classification is approved; reconcile outcomes with validation results through KPI-021
    owner_stakeholder: STK-003
    related: [BP-004, CON-003]
  - id: RSK-002
    statement: The dry run diverges from production rules and gives false confidence
    cause: ASM-006 unvalidated
    impact: Errors that the dry run reported as absent appear in the first live payroll
    provisional_rating: High
    mitigation: Show simulation limitations to users as epic-03 requires; track KPI-010 against KPI-009
    owner_stakeholder: STK-003
    related: [BP-003, DEC-016]
  - id: RSK-003
    statement: An incorrect AI mapping suggestion is accepted and causes misconfiguration
    cause: Reviewer over-reliance on suggestions
    impact: Wrong field or pay-code mapping passes into validation
    provisional_rating: Medium
    mitigation: Apply AIB-002, AIB-003 and AIB-009; validate every mapping deterministically after review; track KPI-007
    owner_stakeholder: STK-004
    related: [AI-001, AI-002]
  - id: RSK-004
    statement: Sensitive employee data is exposed to a model or to unauthorized users
    cause: Unmasked model inputs or insufficient role-based visibility
    impact: Privacy breach and loss of trust
    provisional_rating: High
    mitigation: Apply AIB-005 and AIB-006; role-based visibility of history as epic-06 requires
    owner_stakeholder: STK-011
    related: [CON-004, DEC-008]
  - id: RSK-005
    statement: A retried or interrupted operation creates duplicate activation effects
    cause: Retry semantics not yet designed
    impact: Duplicate profiles or duplicate payroll effects
    provisional_rating: Medium
    mitigation: Treat duplicate-free recovery as a requirement from PA-11; track KPI-014
    owner_stakeholder: STK-004
    related: [DEC-017]
  - id: RSK-006
    statement: A bulk fix alters unrelated or sensitive employee data
    cause: Fix scope not previewed or not authorized
    impact: Silent data corruption across many records
    provisional_rating: High
    mitigation: Preview affected records and fields before applying, as epic-05 requires; require authorization for sensitive fields
    owner_stakeholder: STK-003
    related: [DEC-007, DEC-019]
  - id: RSK-007
    statement: The three program targets are treated as commitments before baselines exist
    cause: DEC-005 unresolved
    impact: Delivery judged against figures that cannot be measured
    provisional_rating: Medium
    mitigation: Keep baseline and target status PENDING until DEC-005 is approved
    owner_stakeholder: STK-010
    related: [KPI-001, KPI-002, KPI-003]
  - id: RSK-008
    statement: A jurisdiction is assumed implicitly in rules, examples or wording
    cause: DEC-001 unresolved
    impact: Specifications that are wrong for the actual jurisdiction
    provisional_rating: Medium
    mitigation: Scan artifacts for jurisdiction and regulation names at every validation run
    owner_stakeholder: STK-003
    related: [CON-005]
  - id: RSK-009
    statement: Entity inheritance silently assigns the wrong jurisdiction to a sub-entity
    cause: Inheritance rules undefined
    impact: Incorrect withholding for affected employees
    provisional_rating: High
    mitigation: Surface ambiguous or conflicting assignments for resolution as epic-02 requires; track KPI-008
    owner_stakeholder: STK-003
    related: [DEC-013, BN-03]
  - id: RSK-010
    statement: The root-cause hypotheses are wrong and the solution addresses the wrong problem
    cause: ASM-014 unvalidated
    impact: Investment without improvement in the program targets
    provisional_rating: Medium
    mitigation: Validate HYP-001 to HYP-007 with product walkthroughs and support-case analysis before Task 03
    owner_stakeholder: STK-004
    related: [OQ-003]
  - id: RSK-011
    statement: An architecture is locked in before business and technical discovery are complete
    cause: Conflicting status of tech-stack.md, recorded as DEC-022
    impact: Requirements shaped by technology rather than business need
    provisional_rating: Medium
    mitigation: Resolve DEC-022 before solution architecture work; keep Task 01 artifacts technology-neutral
    owner_stakeholder: STK-004
    related: [DEC-022]
  - id: RSK-012
    statement: Partial activation leaves a cohort incomplete at go-live
    cause: Unresolved records not finished before the first live payroll
    impact: Some employees not paid in the first run
    provisional_rating: Medium
    mitigation: Make unresolved records visible in outcome review; define the hand-off to first live payroll in DEC-021
    owner_stakeholder: STK-001
    related: [DEC-021, JS-13]
  - id: RSK-013
    statement: Activation history is insufficient for troubleshooting or review
    cause: Required events and retention undefined
    impact: Outcomes that cannot be explained to the client or a reviewer
    provisional_rating: Medium
    mitigation: Agree the required events in DEC-008; track KPI-020
    owner_stakeholder: STK-006
    related: [DEC-008]
