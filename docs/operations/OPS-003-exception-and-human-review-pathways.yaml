# DRAFT. Task 03 Part 1. Proposed content for human review; nothing here is approved.
artifact_id: OPS-003
title: Exception and Human-Review Pathways
status: DRAFT
version: '0.2'
task: Task 03 Part 1, Operational Modelling and Process Foundation
sources:
- OPS-002
- ARC-002
- ARC-004
- ARC-006
- BIZ-005
- BIZ-007
- product-backlog.md
notes:
- Exception identifiers EXC-01 and onward are local to this artifact.
- basis SOURCED means the exception is stated in a cited source; PROPOSED means it is inferred and needs confirmation.
- Where DEC-006 or DEC-007 governs handling, the destination is UNRESOLVED and the options are in OPS-002 decision points.
- No approval authority, escalation destination, threshold or regulatory obligation is invented.
- 'Version 0.2: every exception names its capability; EXC-22 (suspected fraud or risk indicator) and EXC-23 (stakeholder dispute) added as proposed categories. No detection rules, thresholds or dispute procedures are invented.'
human_and_ai_boundaries:
  deterministic:
  - Input inspection
  - Validation and severity classification once rules are decided
  - Isolation of failing records
  - Recovery without duplicate effects
  - Revalidation of corrected records
  - Access and retention control
  ai_may_assist:
  - Field-mapping suggestions (AI-001)
  - Pay-code suggestions (AI-002)
  - Plain-language explanations of messages (AI-003)
  - Corrective suggestions (AI-004)
  human_review:
  - Mapping and assignment review
  - Review of validation and dry-run results
  - Diagnosis and correction of records
  - Preparation of bulk fixes
  - Review of changes and decisions
  reserved_human_decisions:
  - Release of reviewed mappings, if DEC-007 requires it
  - Activation approval (CAP-031)
  - Authorization of sensitive changes and bulk fixes (CAP-032)
  - Whether a cohort with unresolved records proceeds (DEC-021)
  rules:
  - AI never approves, activates, commits or clears a validation finding (AIB-002, AIB-007).
  - Model confidence only orders work for review (AIB-003).
  - Sensitive values are masked before any model call (AIB-006, pending security confirmation).
  - Core activation works without AI (AIB-012).
