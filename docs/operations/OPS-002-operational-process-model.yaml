- id: PRC-05
  name: Remediate exceptions and revalidate corrected records
  business_purpose: Let administrators find, understand and correct failing records, alone or in a reviewed bulk fix, and send only the corrected records back for validation.
  justification: BN-05 opaque error reporting and BN-02 manual intervention; BP-002 cost of delivery; the target of 75 percent fewer support touchpoints (a target, baseline pending).
  value_stream_stage: VS-05
  journey_stages:
  - JS-10
  - JS-11
  capabilities:
  - CAP-006
  - CAP-008
  - CAP-025
  - CAP-026
  - CAP-027
  - CAP-032
  objectives:
  - BO-002
  - BO-005
  - BO-007
  kpis:
  - KPI-015
  - KPI-016
  - KPI-017
  epics:
  - EPIC-05
  stories:
  - PA-12
  - PA-13
  - PA-14
  trigger: PRC-03 routes records with findings, or PRC-04 isolates records whose activation failed.
  preconditions:
  - Each record to remediate has a reported reason, with the affected field when available.
  roles:
  - role: STK-001
    part: Diagnoses and corrects records; prepares bulk fixes
  - role: STK-002
    part: Consulted on errors that need manual investigation
  - role: STK-003
    part: Accountable for bulk corrections and sensitive changes (proposed)
  - role: STK-011
    part: Consulted on sensitive changes (inferred role)
  steps:
  - id: S1
    activity: Open a failing record and read the record- and field-level reason
    performed_by: STK-001
    classification: HUMAN_REVIEW
    capabilities:
    - CAP-025
    exceptions:
    - EXC-15
  - id: S2
    activity: Offer an optional plain-language explanation of the message
    performed_by: System
    classification: AI_SUPPORTED
    capabilities:
    - CAP-025
    ai_support:
      opportunity: AI-003
      rules:
      - AIB-002
      - AIB-004
      - AIB-006
      - AIB-010
      - AIB-012
      note: Explains only; does not change data or validity.
  - id: S3
    activity: Offer an optional corrective suggestion tied to the reported issue
    performed_by: System
    classification: AI_SUPPORTED
    capabilities:
    - CAP-026
    ai_support:
      opportunity: AI-004
      rules:
      - AIB-002
      - AIB-004
      - AIB-006
      - AIB-007
      - AIB-008
      - AIB-010
      note: Never silently changes employee data (PA-12).
    exceptions:
    - EXC-15
  - id: S4
    activity: Correct the record using supported data
    performed_by: STK-001
    classification: HUMAN_REVIEW
    capabilities:
    - CAP-026
  - id: S5
    activity: Prepare a bulk fix for records with the same eligible issue, showing affected records and fields before application
    performed_by: STK-001
    classification: HUMAN_REVIEW
    capabilities:
    - CAP-027
    exceptions:
    - EXC-17
    note: Autonomous AI bulk fixes are rejected (AI-009). P1 story PA-14.
  - id: S6
    activity: Authorize a sensitive change or a bulk fix that needs approval
    performed_by: UNRESOLVED (DEC-007)
    classification: RESERVED_HUMAN_DECISION
    capabilities:
    - CAP-032
    exceptions:
    - EXC-18
  - id: S7
    activity: Apply the correction or the approved bulk fix to the selected records and fields only
    performed_by: System
    classification: DETERMINISTIC
    capabilities:
    - CAP-027
  - id: S8
    activity: Submit only the corrected records for revalidation in PRC-03; other completed records are not reprocessed
    performed_by: System
    classification: DETERMINISTIC
    capabilities:
    - CAP-026
    exceptions:
    - EXC-16
    note: BR-005 applies.
  inputs:
  - Records with findings from PRC-03
  - Isolated failures from PRC-04
  outputs:
  - Corrected records returned to PRC-03
  - Records still unresolved, kept distinct from activated records
  - A record of each correction and bulk fix
  information_used:
  - The failing record data and fields
  - Validation and dry-run findings
  - Bulk-fix scope
  decision_points:
  - id: D1
    name: Accept, edit or reject a corrective suggestion
    at_step: S4
    classification: HUMAN_REVIEW
    authority: STK-001
    authority_basis: ARC-004 assumption; CAP-026 accountable role STK-001
    outcomes:
    - Correction applied by the administrator
    - Suggestion rejected; manual investigation (EXC-15)
    related_rules:
    - BR-005
    related_decisions:
    - DEC-020
  - id: D2
    name: Is a field eligible for bulk correction?
    at_step: S5
    classification: DETERMINISTIC
    authority: Rule defined by STK-003; eligible fields are UNRESOLVED
    authority_basis: DEC-019
    outcomes:
    - 'Eligible: proceed to S6 or S7'
    - 'Not eligible: block or route for approval (EXC-17)'
    related_rules:
    - BR-007
    related_decisions:
    - DEC-019
  - id: D3
    name: Authorize a sensitive change or bulk fix
    at_step: S6
    classification: RESERVED_HUMAN_DECISION
    authority: UNRESOLVED
    authority_basis: DEC-007; CAP-032 owner STK-003 is an ARC-004 assumption
    options:
    - The payroll or compliance owner authorizes
    - An authorized reviewer (STK-006) other than the person who prepared the change authorizes
    - No separate authorization for fields the payroll or compliance owner designates as low risk
    outcomes:
    - 'Authorized: apply (S7)'
    - 'Rejected: no change; the record stays in remediation'
    related_rules:
    - BR-007
    - BR-009
    related_decisions:
    - DEC-007
    - DEC-008
  handoffs:
  - from: PRC-05
    to: PRC-03
    what: Corrected records only, for revalidation
  - from: PRC-05
    to: PRC-06
    what: Records that remain unresolved, with their current reason
  human_intervention_points:
  - S1
  - S4
  - S5
  - S6
  automation:
    opportunities:
    - Record- and field-level diagnosis
    - Optional explanations and corrective suggestions (AI-003, AI-004)
    - Targeted revalidation of corrected records
    limitations:
    - Errors with no safe recommendation need manual investigation (DEC-020)
    - Bulk-fix eligibility and approvals are open (DEC-019, DEC-007)
    ai_involvement: Optional explanation at S2 and suggestion at S3 only.
  controls:
  - BR-005
  - BR-007
  - BR-009
  - AIB-002
  - AIB-004
  - AIB-007
  - AIB-010
  open_items:
  - DEC-007
  - DEC-019
  - DEC-020
  basis: PROPOSED
  exceptions:
  - EXC-15
  - EXC-16
  - EXC-17
  - EXC-18
- id: PRC-06
  name: Review outcomes and activation history
  business_purpose: Let users and reviewers distinguish activated, failed and pending records, understand why, and trace how each profile reached its state.
  justification: BN-05 opaque error reporting; BP-005 early churn and brand trust; KPI-018 time to understand outcomes.
  value_stream_stage: VS-06
  journey_stages:
  - JS-12
  capabilities:
  - CAP-007
  - CAP-009
  - CAP-028
  - CAP-029
  - CAP-030
  - CAP-033
  - CAP-034
  objectives:
  - BO-007
  - BO-008
  kpis:
  - KPI-018
  - KPI-019
  - KPI-020
  - KPI-002
  - KPI-003
  - KPI-022
  kpi_note: KPI-002, KPI-003 and KPI-022 are the program-level measures linked through CAP-030, which is provisional (DEC-023); baselines are pending (DEC-005). KPI-022 also depends on the boundary VSB-01 (DEC-021).
  epics:
  - EPIC-06
  stories:
  - PA-15
  - PA-16
  trigger: Batch processing has started, finished, or records still need attention.
  preconditions:
  - Record outcomes exist from PRC-04 or PRC-05.
  roles:
  - role: STK-001
    part: Reviews the batch summary and per-record outcomes
  - role: STK-006
    part: Reviews changes and decisions (PA-16)
  - role: STK-002
    part: Consulted when outcomes need explanation to the client
  - role: STK-011
    part: Owns access and retention of activation detail (inferred role)
  steps:
  - id: S1
    activity: Show the batch summary, distinguishing activated, failed and attention-required records; a batch still processing is not shown as complete
    performed_by: System
    classification: DETERMINISTIC
    capabilities:
    - CAP-028
  - id: S2
    activity: Show, for each record not activated, its current reason or next required action
    performed_by: System
    classification: DETERMINISTIC
    capabilities:
    - CAP-028
    exceptions:
    - EXC-21
  - id: S3
    activity: Record mapping changes, corrections, validation results, approvals and outcomes for review
    performed_by: System
    classification: DETERMINISTIC
    capabilities:
    - CAP-029
  - id: S4
    activity: Review activation changes and decisions
    performed_by: STK-006
    classification: HUMAN_REVIEW
    capabilities:
    - CAP-029
  - id: S5
    activity: Limit visibility of sensitive detail to authorized roles and keep data only as long as agreed
    performed_by: System
    classification: DETERMINISTIC
    capabilities:
    - CAP-033
    - CAP-034
    note: BR-009. Visibility and retention rules are open (DEC-008). CAP-009 is a proposed capability (PCR-010).
  - id: S6
    activity: Report outcomes against the target metrics
    performed_by: System
    classification: DETERMINISTIC
    capabilities:
    - CAP-030
    note: 'Provisional: in scope only if DEC-023 is decided; baselines are pending (DEC-005).'
  - id: S7
    activity: Mark the batch reviewed; the hand-off to the first live payroll is a boundary (VSB-01)
    performed_by: STK-001
    classification: HUMAN_REVIEW
    capabilities:
    - CAP-028
    exceptions:
    - EXC-21
    note: DEC-021 is open; no process is modelled beyond the boundary.
  inputs:
  - Record and batch outcomes
  - Recorded changes and decisions
  outputs:
  - A batch summary and per-record outcomes
  - A reviewable activation history
  - Outcome measures, if CAP-030 is confirmed
  information_used:
  - Batch and record outcomes
  - History of changes and decisions
  - Sensitive employee details, subject to role-based access
  decision_points:
  - id: D1
    name: Who may see sensitive activation detail
    at_step: S5
    classification: DETERMINISTIC
    authority: Rules owned by STK-011 (inferred role); the rules themselves are UNRESOLVED
    authority_basis: DEC-008; ARC-004 assumption
    outcomes:
    - Detail shown to an authorized role
    - Detail withheld
    related_rules:
    - BR-009
    related_decisions:
    - DEC-008
  - id: D2
    name: Is the batch ready to leave review
    at_step: S7
    classification: HUMAN_REVIEW
    authority: STK-001 for the batch; whether a cohort with unresolved records may go live is UNRESOLVED
    authority_basis: DEC-021; RSK-012
    outcomes:
    - Reviewed; boundary VSB-01 reached
    - Records still need attention; return to PRC-05
    related_rules:
    - BR-002
    related_decisions:
    - DEC-021
  handoffs:
  - from: PRC-06
    to: PRC-05
    what: Records that still need attention
  - from: PRC-06
    to: VSB-01
    what: Reviewed outcome, at the boundary only
