    name: Data mapping and normalization
  - id: CAP-003
    name: Entity and jurisdiction resolution
  business_domain_basis: 'ASSUMPTION: the Level 1 capability group from ARC-001 is used as the business domain (OPS-009 A-07)'
  value_stream_stage: VS-02
  journey_stages:
  - JS-03
  - JS-04
  - JS-05
  capabilities:
  - CAP-002
  - CAP-003
  - CAP-013
  - CAP-014
  - CAP-015
  - CAP-016
  - CAP-017
  - CAP-018
  objectives:
  - BO-002
  - BO-003
  - BO-006
  kpis:
  - KPI-006
  - KPI-007
  - KPI-008
  epics:
  - EPIC-02
  stories:
  - PA-03
  - PA-04
  - PA-05
  - PA-06
  trigger: PRC-01 hands over structurally usable batch input.
  preconditions:
  - The batch input is structurally usable (PRC-01 D1).
  - The required payroll target fields and the authoritative pay-code catalogue are identified (DEC-012).
  roles:
  - role: STK-001
    part: Reviews and corrects mappings and assignments
  - role: STK-002
    part: Consulted on unusual source schemas and pay codes
  - role: STK-003
    part: Accountable for mapping and entity or jurisdiction outcomes; owns inheritance rules
  - role: STK-004
